[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-super-engine"
version = "0.1.0"
description = "End-to-end fantasy football engine: scoring, draft, lineup optimization, waivers, trades, tiering, and a FastAPI surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fantasy Super-Engine contributors" }]
dependencies = [
    "pydantic>=2.6,<3",
    "numpy>=1.26",
    "pulp>=2.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
fantasy = "fantasy.cli:main"

[tool.setuptools.packages.find]
include = ["fantasy*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pulp.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"  # matches the numpy stubs' minimum syntax requirement; the package itself still declares requires-python >=3.11
ignore_missing_imports = true
disallow_untyped_defs = false
